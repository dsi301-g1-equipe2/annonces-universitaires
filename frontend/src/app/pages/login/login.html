<main class="login">
  <h1>Connexion étudiant</h1>

  <form [formGroup]="form" (ngSubmit)="envoyer()">
    <label>
      E-mail institutionnel
      <input type="email" formControlName="email" autocomplete="username" />
    </label>

    <label>
      Mot de passe
      <input type="password" formControlName="motDePasse" autocomplete="current-password" />
    </label>

    @if (erreur()) {
      <p class="erreur" role="alert">{{ erreur() }}</p>
    }

    <button type="submit" [disabled]="form.invalid || chargement()">
      {{ chargement() ? 'Connexion…' : 'Se connecter' }}
    </button>
  </form>
</main>
